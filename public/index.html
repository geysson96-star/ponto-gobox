<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consulta de pacotes · GoBox</title>
<meta name="description" content="Consulte se o seu pacote já está na GoBox.">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/cubo.png">
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/consulta.css">
</head>
<body>
<div class="pagina">
  <header class="topo">
    <a class="marca" href="/" aria-label="GoBox — início">
      <img src="/assets/cubo.png" alt="" class="marca-cubo">
      <img src="/assets/wordmark.png" alt="" class="marca-nome">
    </a>
  </header>

  <main class="centro">
    <div class="conteudo">
      <p class="selo"><span class="selo-ponto" aria-hidden="true"></span>Consulta de pacotes</p>
      <h1>Seu pacote já está na GoBox?</h1>
      <p class="subtitulo">Digite o código de envio ou de rastreio para consultar.</p>

      <form id="form-consulta" class="formulario" novalidate>
        <label for="codigo">Código de envio ou rastreio</label>
        <div class="linha-busca">
          <input id="codigo" name="codigo" type="text" inputmode="text" autocomplete="off"
                 autocapitalize="characters" spellcheck="false" maxlength="64"
                 placeholder="Ex.: XX000000000BR" required>
          <button type="submit" id="botao-consultar" class="botao-principal">Consultar</button>
        </div>
      </form>

      <div id="resultado" class="resultado" role="status" aria-live="polite"></div>
    </div>
  </main>
</div>
<script src="/consulta.js"></script>
</body>
</html>
