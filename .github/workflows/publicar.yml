name: Publicar site e APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Gerar APK do celular
        working-directory: android
        env:
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ponto.html
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Montar o site
        run: |
          mkdir -p _site
          cp -r web/* _site/
          V=$(echo "$GITHUB_SHA" | cut -c1-8)
          sed -i "s/__V__/$V/g" _site/*.html _site/*.js
          cp android/app/build/outputs/apk/release/app-release.apk _site/ponto-gobox.apk

      - name: Guardar o APK na branch apk
        run: |
          mkdir /tmp/apkbranch && cd /tmp/apkbranch
          git init -q -b apk
          cp $GITHUB_WORKSPACE/_site/ponto-gobox.apk .
          git add ponto-gobox.apk
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "APK ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
